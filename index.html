<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dress-Up Star</title>
<style>
  :root {
    --bg: #fff4fa;
    --card: #ffffff;
    --ink: #3b2a4d;
    --accent: #ff5fa2;
    --accent-2: #7b61ff;
    --line: #f0d9ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header { text-align: center; padding: 16px 16px 4px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); color: var(--accent); }
  header p { margin: 4px 0 0; font-size: 1rem; }

  main {
    display: grid;
    grid-template-columns: minmax(280px, 420px) minmax(300px, 520px);
    gap: 20px;
    justify-content: center;
    padding: 16px;
    max-width: 1000px;
    margin: 0 auto;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

  .stage, .panel {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 6px 0 var(--line);
  }
  #stage svg { width: 100%; height: auto; display: block; border-radius: 16px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  button {
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    border: 3px solid var(--line);
    background: #fff;
    border-radius: 16px;
    padding: 8px 12px;
    transition: transform .08s;
  }
  button:hover { transform: translateY(-2px); }
  button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
  .actions button { flex: 1; font-weight: bold; }
  .primary { background: var(--accent); border-color: #e0407f; color: #fff; }
  .secondary { background: var(--accent-2); border-color: #5b43d6; color: #fff; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { padding: 6px 10px; font-size: .95rem; }
  .tabs button[aria-selected="true"] { background: var(--accent-2); border-color: #5b43d6; color: #fff; }

  h2 { font-size: 1.05rem; margin: 10px 0 6px; }
  .styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .styles button { font-size: .95rem; padding: 10px 6px; }
  .styles button[aria-pressed="true"] { background: #ffe3f0; border-color: var(--accent); }

  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 40px; height: 40px; padding: 0; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--accent-2); }
  .hint { font-size: .9rem; opacity: .8; margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>✨ Dress-Up Star ✨</h1>
  <p>Pick her clothes, hair, glasses and more!</p>
</header>

<main>
  <section class="stage">
    <div id="stage" aria-label="Your character"></div>
    <div class="actions">
      <button class="primary" id="random">🎲 Surprise me!</button>
      <button class="secondary" id="save">📷 Save picture</button>
      <button id="reset">↩️ Start over</button>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="options"></div>
  </section>
</main>

<script>
"use strict";

/* ---------- Color palettes ---------- */
const SKIN   = ["#ffe0c8", "#f8c9a0", "#e5a878", "#c68652", "#9a6038", "#6b4026"];
const HAIR   = ["#2b1b17", "#5a3825", "#8b4a2b", "#d9a441", "#f3d98b", "#ff6fae", "#5aa9ff", "#9b6bff", "#4ecb8d", "#e8e8ee"];
const CLOTH  = ["#ff5fa2", "#ff8a3d", "#ffd23f", "#4ecb8d", "#3fb6ff", "#7b61ff", "#b55fe0", "#ffffff", "#444455", "#e63946"];
const SHOE   = ["#ffffff", "#ff5fa2", "#3fb6ff", "#ffd23f", "#6b4026", "#2b2b3a"];
const GLASS  = ["#2b2b3a", "#ff5fa2", "#3fb6ff", "#ffd23f", "#7b61ff", "#e63946"];

/* ---------- Categories shown in the menu ---------- */
const CATS = [
  { id: "skin",    label: "🧑 Skin",    colorKey: "skin", colors: SKIN },
  { id: "hair",    label: "💇 Hair",    styleKey: "hair", colorKey: "hairColor", colors: HAIR, styles: [
      ["long", "Long"], ["bob", "Bob"], ["short", "Short"], ["ponytail", "Ponytail"],
      ["pigtails", "Pigtails"], ["buns", "Buns"], ["curly", "Curly"] ] },
  { id: "top",     label: "👚 Top",     styleKey: "top", colorKey: "topColor", colors: CLOTH, styles: [
      ["tee", "T-shirt"], ["heart", "Heart tee"], ["hoodie", "Hoodie"], ["tank", "Tank top"] ] },
  { id: "bottom",  label: "👖 Bottom",  styleKey: "bottom", colorKey: "bottomColor", colors: CLOTH, styles: [
      ["skirt", "Skirt"], ["longskirt", "Long skirt"], ["shorts", "Shorts"], ["pants", "Pants"] ] },
  { id: "dress",   label: "👗 Dress",   styleKey: "dress", colorKey: "dressColor", colors: CLOTH, styles: [
      ["none", "No dress"], ["party", "Party dress"], ["sun", "Sundress"], ["gown", "Princess gown"] ],
      hint: "A dress replaces the top and bottom." },
  { id: "shoes",   label: "👟 Shoes",   styleKey: "shoes", colorKey: "shoeColor", colors: SHOE, styles: [
      ["sneakers", "Sneakers"], ["boots", "Boots"], ["sandals", "Sandals"] ] },
  { id: "glasses", label: "👓 Glasses", styleKey: "glasses", colorKey: "glassColor", colors: GLASS, styles: [
      ["none", "None"], ["round", "Round"], ["square", "Square"], ["heart", "Hearts"], ["sun", "Sunglasses"] ] },
  { id: "hat",     label: "👑 Hats",    styleKey: "hat", colorKey: "hatColor", colors: CLOTH, styles: [
      ["none", "None"], ["beanie", "Beanie"], ["crown", "Crown"], ["bow", "Big bow"],
      ["sunhat", "Sun hat"], ["ears", "Cat ears"] ] },
  { id: "extras",  label: "💎 Extras",  multi: true, styles: [
      ["necklace", "Necklace"], ["earrings", "Earrings"], ["scarf", "Scarf"],
      ["wand", "Magic wand"], ["wings", "Fairy wings"], ["sticker", "Star sticker"] ],
      hint: "You can pick as many as you like!" },
  { id: "scene",   label: "🌈 Scene",   styleKey: "scene", styles: [
      ["sky", "Sunny sky"], ["candy", "Candy pink"], ["mint", "Mint garden"],
      ["sunset", "Sunset"], ["night", "Starry night"] ] },
];

const DEFAULTS = {
  skin: SKIN[1],
  hair: "long", hairColor: HAIR[1],
  top: "tee", topColor: CLOTH[0],
  bottom: "skirt", bottomColor: CLOTH[5],
  dress: "none", dressColor: CLOTH[2],
  shoes: "sneakers", shoeColor: SHOE[0],
  glasses: "none", glassColor: GLASS[0],
  hat: "none", hatColor: CLOTH[0],
  extras: [],
  scene: "sky",
};

let state = structuredClone(DEFAULTS);
let currentTab = "hair";

/* ---------- Drawing helpers ---------- */
const OUT = 'stroke="rgba(0,0,0,.2)" stroke-width="2" stroke-linejoin="round"';

function heartPath(cx, cy, s) {
  return `M${cx} ${cy + 10*s} C${cx - 18*s} ${cy - 2*s} ${cx - 8*s} ${cy - 14*s} ${cx} ${cy - 5*s} ` +
         `C${cx + 8*s} ${cy - 14*s} ${cx + 18*s} ${cy - 2*s} ${cx} ${cy + 10*s}Z`;
}
function starPoints(cx, cy, R, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r : R;
    pts.push((cx + Math.cos(a) * rad).toFixed(1) + "," + (cy + Math.sin(a) * rad).toFixed(1));
  }
  return pts.join(" ");
}

/* ---------- Scene backgrounds ---------- */
function scene(kind) {
  const grads = {
    sky:    ["#9be0ff", "#e8f9ff", "#7bd88f"],
    candy:  ["#ffc2e2", "#fff0f8", "#ffa6d0"],
    mint:   ["#b8f2d8", "#f0fff8", "#7bd88f"],
    sunset: ["#ff9a76", "#ffe0a3", "#b07acb"],
    night:  ["#1f1b4d", "#4a3f8f", "#2f2a66"],
  }[kind];
  let extra = "";
  if (kind === "night") {
    for (const [x, y] of [[30,40],[90,90],[250,50],[270,150],[60,200],[230,230],[20,320]])
      extra += `<polygon points="${starPoints(x, y, 7, 3)}" fill="#fff6a8"/>`;
    extra += `<circle cx="255" cy="70" r="22" fill="#fff6c8"/>`;
  } else if (kind === "sky") {
    extra += `<ellipse cx="70" cy="70" rx="38" ry="16" fill="#fff"/><ellipse cx="95" cy="60" rx="26" ry="14" fill="#fff"/>
              <ellipse cx="240" cy="110" rx="34" ry="14" fill="#fff"/><circle cx="260" cy="40" r="20" fill="#ffe66d"/>`;
  } else if (kind === "candy") {
    for (const [x, y] of [[40,60],[250,90],[60,250],[260,300],[150,30]])
      extra += `<path d="${heartPath(x, y, 1.3)}" fill="#ff8fc4" opacity=".6"/>`;
  } else if (kind === "mint") {
    for (const [x, y] of [[40,350],[250,360],[80,380],[220,390]])
      extra += `<circle cx="${x}" cy="${y}" r="9" fill="#ff8fc4"/><circle cx="${x}" cy="${y}" r="4" fill="#ffe66d"/>`;
  } else if (kind === "sunset") {
    extra += `<circle cx="150" cy="330" r="60" fill="#ffd36e" opacity=".8"/>`;
  }
  return `<defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${grads[0]}"/><stop offset="1" stop-color="${grads[1]}"/></linearGradient></defs>
    <rect width="300" height="480" fill="url(#bgGrad)"/>${extra}
    <ellipse cx="150" cy="450" rx="170" ry="40" fill="${grads[2]}"/>`;
}

/* ---------- Character parts ---------- */
function hairBack(style, c) {
  switch (style) {
    case "long":     return `<path d="M95 110 Q95 50 150 50 Q205 50 205 110 L218 235 Q150 255 82 235Z" fill="${c}" ${OUT}/>`;
    case "bob":      return `<path d="M96 115 Q96 52 150 52 Q204 52 204 115 L208 165 Q150 178 92 165Z" fill="${c}" ${OUT}/>`;
    case "ponytail": return `<path d="M192 85 Q262 90 248 200 Q238 150 196 128Z" fill="${c}" ${OUT}/>`;
    case "pigtails": return `<ellipse cx="88" cy="160" rx="16" ry="42" fill="${c}" ${OUT}/><ellipse cx="212" cy="160" rx="16" ry="42" fill="${c}" ${OUT}/>`;
    case "buns":     return `<circle cx="108" cy="52" r="24" fill="${c}" ${OUT}/><circle cx="192" cy="52" r="24" fill="${c}" ${OUT}/>`;
    case "curly": {
      let s = "";
      for (const [x, y] of [[98,70],[88,105],[88,142],[100,170],[202,70],[212,105],[212,142],[200,170],[125,52],[150,45],[175,52]])
        s += `<circle cx="${x}" cy="${y}" r="22" fill="${c}" ${OUT}/>`;
      return s;
    }
    default: return "";
  }
}
function hairFront(style, c) {
  let s = `<path d="M99 112 Q96 52 150 52 Q204 52 201 112 Q190 84 150 80 Q110 84 99 112Z" fill="${c}" ${OUT}/>`;
  if (style === "short") s += `<path d="M99 112 L96 135 Q104 120 108 112Z M201 112 L204 135 Q196 120 192 112Z" fill="${c}"/>`;
  if (style === "ponytail") s += `<circle cx="196" cy="100" r="7" fill="#ff5fa2"/>`;
  if (style === "pigtails") s += `<circle cx="92" cy="122" r="7" fill="#ff5fa2"/><circle cx="208" cy="122" r="7" fill="#ff5fa2"/>`;
  return s;
}

function body(skin) {
  return `
    <rect x="122" y="300" width="24" height="132" rx="10" fill="${skin}" ${OUT}/>
    <rect x="154" y="300" width="24" height="132" rx="10" fill="${skin}" ${OUT}/>
    <line x1="108" y1="192" x2="96" y2="285" stroke="${skin}" stroke-width="18" stroke-linecap="round"/>
    <line x1="192" y1="192" x2="204" y2="285" stroke="${skin}" stroke-width="18" stroke-linecap="round"/>
    <circle cx="95" cy="292" r="10" fill="${skin}"/><circle cx="205" cy="292" r="10" fill="${skin}"/>
    <rect x="140" y="150" width="20" height="35" fill="${skin}"/>
    <path d="M112 178 Q150 192 188 178 L190 300 L110 300Z" fill="${skin}"/>`;
}

function face(skin) {
  return `
    <circle cx="150" cy="110" r="50" fill="${skin}" ${OUT}/>
    <ellipse cx="132" cy="113" rx="6" ry="8" fill="#2b2b3a"/><ellipse cx="168" cy="113" rx="6" ry="8" fill="#2b2b3a"/>
    <circle cx="134" cy="110" r="2.2" fill="#fff"/><circle cx="170" cy="110" r="2.2" fill="#fff"/>
    <circle cx="118" cy="128" r="8" fill="#ff8fa3" opacity=".45"/><circle cx="182" cy="128" r="8" fill="#ff8fa3" opacity=".45"/>
    <path d="M138 128 Q150 142 162 128" fill="none" stroke="#b5384f" stroke-width="3" stroke-linecap="round"/>`;
}

function bottomWear(style, c) {
  switch (style) {
    case "skirt":     return `<path d="M110 288 L190 288 L210 365 L90 365Z" fill="${c}" ${OUT}/>`;
    case "longskirt": return `<path d="M110 288 L190 288 L215 415 L85 415Z" fill="${c}" ${OUT}/>`;
    case "shorts":    return `<path d="M110 288 L190 288 L192 350 L152 350 L150 325 L148 350 L108 350Z" fill="${c}" ${OUT}/>`;
    case "pants":     return `<path d="M110 288 L190 288 L184 428 L154 428 L150 325 L146 428 L116 428Z" fill="${c}" ${OUT}/>`;
  }
  return "";
}

function topWear(style, c) {
  const torso = `<path d="M112 178 Q150 192 188 178 L190 298 L110 298Z" fill="${c}" ${OUT}/>`;
  const shortSleeves = `<path d="M114 178 L86 205 L100 228 L120 205Z" fill="${c}" ${OUT}/><path d="M186 178 L214 205 L200 228 L180 205Z" fill="${c}" ${OUT}/>`;
  switch (style) {
    case "tee":    return torso + shortSleeves;
    case "heart":  return torso + shortSleeves + `<path d="${heartPath(150, 235, 1.5)}" fill="#fff" opacity=".9"/>`;
    case "hoodie":
      return `<line x1="108" y1="192" x2="96" y2="285" stroke="${c}" stroke-width="22" stroke-linecap="round"/>
              <line x1="192" y1="192" x2="204" y2="285" stroke="${c}" stroke-width="22" stroke-linecap="round"/>` +
             torso +
             `<path d="M122 180 Q150 215 178 180 Q150 170 122 180Z" fill="rgba(0,0,0,.15)"/>
              <path d="M125 262 L175 262 L180 290 L120 290Z" fill="rgba(0,0,0,.12)"/>`;
    case "tank":
      return `<path d="M124 182 L136 178 Q150 205 164 178 L176 182 L188 298 L112 298Z" fill="${c}" ${OUT}/>`;
  }
  return "";
}

function dressWear(style, c) {
  switch (style) {
    case "party":
      return `<path d="M112 178 Q150 192 188 178 L192 215 L220 375 Q150 392 80 375 L108 215Z" fill="${c}" ${OUT}/>
              <rect x="108" y="212" width="84" height="10" fill="rgba(255,255,255,.55)"/>
              <path d="M114 178 L90 200 L102 218 L122 200Z M186 178 L210 200 L198 218 L178 200Z" fill="${c}" ${OUT}/>`;
    case "sun":
      return `<path d="M124 182 L136 178 Q150 205 164 178 L176 182 L188 235 L215 365 Q150 380 85 365 L112 235Z" fill="${c}" ${OUT}/>
              <circle cx="130" cy="290" r="5" fill="#fff" opacity=".8"/><circle cx="165" cy="315" r="5" fill="#fff" opacity=".8"/>
              <circle cx="145" cy="340" r="5" fill="#fff" opacity=".8"/><circle cx="185" cy="280" r="5" fill="#fff" opacity=".8"/>
              <circle cx="115" cy="335" r="5" fill="#fff" opacity=".8"/>`;
    case "gown":
      return `<path d="M120 180 Q150 195 180 180 L186 230 L240 420 Q150 445 60 420 L114 230Z" fill="${c}" ${OUT}/>
              <rect x="112" y="226" width="76" height="9" fill="#ffd23f"/>
              <path d="M114 178 Q96 186 94 206 L120 200Z M186 178 Q204 186 206 206 L180 200Z" fill="${c}" ${OUT}/>
              <circle cx="150" cy="231" r="6" fill="#ffd23f"/>`;
  }
  return "";
}

function shoeWear(style, c) {
  const L = 134, R = 166, y = 436;
  switch (style) {
    case "sneakers":
      return [L, R].map(x => `<ellipse cx="${x}" cy="${y}" rx="21" ry="11" fill="${c}" ${OUT}/>
        <rect x="${x - 21}" y="${y + 4}" width="42" height="6" rx="3" fill="rgba(0,0,0,.2)"/>`).join("");
    case "boots":
      return [L, R].map(x => `<path d="M${x - 14} 398 L${x + 14} 398 L${x + 14} 430 Q${x + 28} 432 ${x + 24} 446 L${x - 22} 446 Q${x - 24} 430 ${x - 14} 430Z" fill="${c}" ${OUT}/>`).join("");
    case "sandals":
      return [L, R].map(x => `<ellipse cx="${x}" cy="${y + 4}" rx="20" ry="7" fill="${c}" ${OUT}/>
        <line x1="${x - 12}" y1="${y - 2}" x2="${x + 12}" y2="${y - 2}" stroke="${c}" stroke-width="4"/>
        <line x1="${x - 10}" y1="${y - 14}" x2="${x + 10}" y2="${y - 4}" stroke="${c}" stroke-width="3"/>`).join("");
  }
  return "";
}

function glassesWear(style, c) {
  switch (style) {
    case "round":
      return `<circle cx="132" cy="113" r="15" fill="rgba(255,255,255,.25)" stroke="${c}" stroke-width="4"/>
              <circle cx="168" cy="113" r="15" fill="rgba(255,255,255,.25)" stroke="${c}" stroke-width="4"/>
              <line x1="147" y1="112" x2="153" y2="112" stroke="${c}" stroke-width="4"/>`;
    case "square":
      return `<rect x="115" y="100" width="32" height="25" rx="5" fill="rgba(255,255,255,.25)" stroke="${c}" stroke-width="4"/>
              <rect x="153" y="100" width="32" height="25" rx="5" fill="rgba(255,255,255,.25)" stroke="${c}" stroke-width="4"/>
              <line x1="147" y1="108" x2="153" y2="108" stroke="${c}" stroke-width="4"/>`;
    case "heart":
      return `<path d="${heartPath(132, 112, 1.3)}" fill="rgba(255,255,255,.25)" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>
              <path d="${heartPath(168, 112, 1.3)}" fill="rgba(255,255,255,.25)" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>`;
    case "sun":
      return `<rect x="113" y="100" width="35" height="24" rx="10" fill="${c}"/>
              <rect x="152" y="100" width="35" height="24" rx="10" fill="${c}"/>
              <line x1="146" y1="106" x2="154" y2="106" stroke="${c}" stroke-width="4"/>
              <rect x="118" y="104" width="12" height="5" rx="2" fill="#fff" opacity=".5"/>`;
  }
  return "";
}

function hatWear(style, c) {
  switch (style) {
    case "beanie":
      return `<path d="M101 84 Q101 32 150 32 Q199 32 199 84Z" fill="${c}" ${OUT}/>
              <rect x="97" y="76" width="106" height="16" rx="8" fill="rgba(255,255,255,.55)" ${OUT}/>
              <circle cx="150" cy="28" r="11" fill="#fff" ${OUT}/>`;
    case "crown":
      return `<path d="M104 72 L104 34 L128 54 L150 26 L172 54 L196 34 L196 72Z" fill="#ffd23f" ${OUT}/>
              <circle cx="150" cy="56" r="6" fill="${c}"/><circle cx="122" cy="64" r="4" fill="${c}"/><circle cx="178" cy="64" r="4" fill="${c}"/>`;
    case "bow":
      return `<path d="M188 62 L160 44 L160 80Z M188 62 L216 44 L216 80Z" fill="${c}" ${OUT}/>
              <circle cx="188" cy="62" r="9" fill="${c}" ${OUT}/>`;
    case "sunhat":
      return `<ellipse cx="150" cy="74" rx="92" ry="15" fill="#f3d98b" ${OUT}/>
              <path d="M110 74 Q110 28 150 28 Q190 28 190 74Z" fill="#f3d98b" ${OUT}/>
              <rect x="110" y="62" width="80" height="11" fill="${c}"/>`;
    case "ears":
      return `<path d="M104 70 L108 26 L138 56Z M196 70 L192 26 L162 56Z" fill="${c}" ${OUT}/>
              <path d="M112 58 L112 40 L128 54Z M188 58 L188 40 L172 54Z" fill="#ffc2e2"/>`;
  }
  return "";
}

function extraBack(list) {
  if (!list.includes("wings")) return "";
  return `<path d="M130 195 Q40 120 50 225 Q60 275 130 255Z" fill="#c9f1ff" stroke="#8fd3ee" stroke-width="3" opacity=".9"/>
          <path d="M170 195 Q260 120 250 225 Q240 275 170 255Z" fill="#c9f1ff" stroke="#8fd3ee" stroke-width="3" opacity=".9"/>`;
}
function extraFront(list) {
  let s = "";
  if (list.includes("necklace")) s += `<path d="M125 182 Q150 215 175 182" fill="none" stroke="#ffd23f" stroke-width="3"/><path d="${heartPath(150, 208, .7)}" fill="#ff5fa2"/>`;
  if (list.includes("scarf"))    s += `<rect x="124" y="170" width="52" height="16" rx="8" fill="#e63946" ${OUT}/><path d="M160 180 L176 230 L158 226Z" fill="#e63946" ${OUT}/>`;
  if (list.includes("earrings")) s += `<circle cx="100" cy="128" r="5" fill="#ffd23f"/><circle cx="200" cy="128" r="5" fill="#ffd23f"/>`;
  if (list.includes("sticker"))  s += `<polygon points="${starPoints(186, 138, 8, 3.5)}" fill="#ffd23f" stroke="#e0a800" stroke-width="1"/>`;
  if (list.includes("wand"))     s += `<line x1="206" y1="290" x2="236" y2="222" stroke="#b07acb" stroke-width="5" stroke-linecap="round"/>
                                       <polygon points="${starPoints(240, 210, 18, 8)}" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>
                                       <circle cx="206" cy="290" r="10" fill="rgba(0,0,0,0)"/>`;
  return s;
}

/* ---------- Render ---------- */
function render() {
  const s = state;
  const hasDress = s.dress !== "none";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" role="img" aria-label="Dress-up character">
    ${scene(s.scene)}
    ${extraBack(s.extras)}
    ${hairBack(s.hair, s.hairColor)}
    ${body(s.skin)}
    ${shoeWear(s.shoes, s.shoeColor)}
    ${hasDress ? dressWear(s.dress, s.dressColor) : bottomWear(s.bottom, s.bottomColor) + topWear(s.top, s.topColor)}
    ${face(s.skin)}
    ${hairFront(s.hair, s.hairColor)}
    ${glassesWear(s.glasses, s.glassColor)}
    ${hatWear(s.hat, s.hatColor)}
    ${extraFront(s.extras)}
  </svg>`;
  document.getElementById("stage").innerHTML = svg;
  renderOptions();
}

/* ---------- Menu ---------- */
function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const cat of CATS) {
    const b = document.createElement("button");
    b.textContent = cat.label;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", cat.id === currentTab);
    b.onclick = () => { currentTab = cat.id; renderTabs(); renderOptions(); };
    tabs.appendChild(b);
  }
}

function renderOptions() {
  const cat = CATS.find(c => c.id === currentTab);
  const box = document.getElementById("options");
  box.innerHTML = "";

  if (cat.styles) {
    const h = document.createElement("h2");
    h.textContent = cat.multi ? "Pick your extras" : "Pick a style";
    box.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "styles";
    for (const [value, label] of cat.styles) {
      const b = document.createElement("button");
      b.textContent = label;
      const on = cat.multi ? state.extras.includes(value) : state[cat.styleKey] === value;
      b.setAttribute("aria-pressed", on);
      b.onclick = () => {
        if (cat.multi) {
          state.extras = on ? state.extras.filter(v => v !== value) : [...state.extras, value];
        } else {
          state[cat.styleKey] = value;
        }
        render();
      };
      grid.appendChild(b);
    }
    box.appendChild(grid);
  }

  if (cat.colors) {
    const h = document.createElement("h2");
    h.textContent = "Pick a color";
    box.appendChild(h);
    const row = document.createElement("div");
    row.className = "swatches";
    for (const color of cat.colors) {
      const b = document.createElement("button");
      b.className = "swatch";
      b.style.background = color;
      b.setAttribute("aria-label", "Color " + color);
      b.setAttribute("aria-pressed", state[cat.colorKey] === color);
      b.onclick = () => { state[cat.colorKey] = color; render(); };
      row.appendChild(b);
    }
    box.appendChild(row);
  }

  if (cat.hint) {
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = cat.hint;
    box.appendChild(p);
  }
}

/* ---------- Buttons ---------- */
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

document.getElementById("random").onclick = () => {
  const next = { extras: [] };
  for (const cat of CATS) {
    if (cat.styleKey) next[cat.styleKey] = pick(cat.styles)[0];
    if (cat.colorKey) next[cat.colorKey] = pick(cat.colors);
  }
  for (const e of CATS.find(c => c.multi).styles) if (Math.random() < 0.3) next.extras.push(e[0]);
  if (Math.random() < 0.6) next.glasses = "none";
  if (Math.random() < 0.5) next.hat = "none";
  if (Math.random() < 0.7) next.dress = "none";
  state = next;
  render();
};

document.getElementById("reset").onclick = () => {
  state = structuredClone(DEFAULTS);
  render();
};

document.getElementById("save").onclick = () => {
  const svg = document.querySelector("#stage svg");
  const data = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = 900; canvas.height = 1440;
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    const a = document.createElement("a");
    a.download = "my-dress-up-star.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  img.src = data;
};

renderTabs();
render();
</script>
</body>
</html>
