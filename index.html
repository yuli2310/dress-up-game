<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dress-Up Star</title>
<style>
  :root {
    --bg: #fff4fa;
    --card: #ffffff;
    --ink: #3b2a4d;
    --accent: #ff5fa2;
    --accent-2: #7b61ff;
    --line: #f0d9ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header { text-align: center; padding: 16px 16px 4px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); color: var(--accent); }
  header p { margin: 4px 0 0; font-size: 1rem; }

  main {
    display: grid;
    grid-template-columns: minmax(280px, 420px) minmax(300px, 520px);
    gap: 20px;
    justify-content: center;
    padding: 16px;
    max-width: 1000px;
    margin: 0 auto;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

  .stage, .panel {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 6px 0 var(--line);
  }
  #stage svg { width: 100%; height: auto; display: block; border-radius: 16px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  button {
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    border: 3px solid var(--line);
    background: #fff;
    border-radius: 16px;
    padding: 8px 12px;
    transition: transform .08s;
  }
  button:hover { transform: translateY(-2px); }
  button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
  .actions button { flex: 1; font-weight: bold; }
  .primary { background: var(--accent); border-color: #e0407f; color: #fff; }
  .secondary { background: var(--accent-2); border-color: #5b43d6; color: #fff; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { padding: 6px 10px; font-size: .95rem; }
  .tabs button[aria-selected="true"] { background: var(--accent-2); border-color: #5b43d6; color: #fff; }

  h2 { font-size: 1.05rem; margin: 10px 0 6px; }
  .styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .styles button { font-size: .95rem; padding: 10px 6px; }
  .styles button[aria-pressed="true"] { background: #ffe3f0; border-color: var(--accent); }

  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 40px; height: 40px; padding: 0; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--accent-2); }
  .hint { font-size: .9rem; opacity: .8; margin: 8px 0 0; }

  /* animations */
  .bob { animation: bob 3s ease-in-out infinite; }
  .char.twirl { transform-box: fill-box; transform-origin: center; animation: twirl .9s ease-in-out; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes twirl { 0% { transform: scaleX(1); } 25% { transform: scaleX(0); } 50% { transform: scaleX(-1); } 75% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .stagewrap { position: relative; overflow: hidden; border-radius: 16px; }
  .sparkle { position: absolute; pointer-events: none; font-size: 1.6rem; animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0) scale(.6); } to { opacity: 0; transform: translateY(-70px) scale(1.3); } }
  @media (prefers-reduced-motion: reduce) {
    .bob, .eyes, .char.twirl { animation: none; }
  }

  /* saved outfits */
  .big { width: 100%; font-weight: bold; margin-top: 8px; }
  .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
  .saved-item { border: 3px solid var(--line); border-radius: 16px; padding: 6px; text-align: center; }
  .saved-item svg { width: 100%; height: auto; border-radius: 10px; display: block; }
  .saved-item .row { display: flex; gap: 4px; margin-top: 4px; }
  .saved-item button { flex: 1; padding: 4px; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <h1>✨ Dress-Up Star ✨</h1>
  <p>Pick her clothes, hair, glasses and more!</p>
</header>

<main>
  <section class="stage">
    <div class="stagewrap" id="wrap"><div id="stage" aria-label="Your character"></div></div>
    <div class="actions">
      <button class="primary" id="random">🎲 Surprise me!</button>
      <button id="twirl">💃 Twirl</button>
      <button id="mute" aria-pressed="false">🔊 Sound on</button>
    </div>
    <div class="actions">
      <button class="secondary" id="save">📷 Save picture</button>
      <button id="reset">↩️ Start over</button>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="options"></div>
  </section>
</main>

<script>
"use strict";

/* ---------- Color palettes ---------- */
const SKIN   = ["#ffe0c8", "#f8c9a0", "#e5a878", "#c68652", "#9a6038", "#6b4026"];
const HAIR   = ["#2b1b17", "#5a3825", "#8b4a2b", "#d9a441", "#f3d98b", "#ff6fae", "#5aa9ff", "#9b6bff", "#4ecb8d", "#e8e8ee"];
const CLOTH  = ["#f2b8c6", "#b3202a", "#f0e6d8", "#c9a27a", "#8fb3a5", "#3f6fd1", "#6b3f7a", "#1f2a44", "#1f1f2b", "#ffffff"];
const SHOE   = ["#ffffff", "#ff5fa2", "#3fb6ff", "#ffd23f", "#6b4026", "#2b2b3a"];
const GLASS  = ["#2b2b3a", "#ff5fa2", "#3fb6ff", "#ffd23f", "#7b61ff", "#e63946"];

/* ---------- Categories shown in the menu ---------- */
const CATS = [
  { id: "skin",    label: "🧑 Skin",    colorKey: "skin", colors: SKIN },
  { id: "hair",    label: "💇 Hair",    styleKey: "hair", colorKey: "hairColor", colors: HAIR, styles: [
      ["long", "Long"], ["wavy", "Wavy"], ["bob", "Bob"], ["short", "Short"], ["pixie", "Pixie"],
      ["ponytail", "Ponytail"], ["pigtails", "Pigtails"], ["braid", "Side braid"], ["buns", "Buns"],
      ["topknot", "Top knot"], ["curly", "Curly"] ] },
  { id: "top",     label: "👚 Top",     styleKey: "top", colorKey: "topColor", colors: CLOTH, styles: [
      ["tee", "Fitted tee"], ["blouse", "Silk blouse"], ["wrap", "Wrap top"], ["turtle", "Turtleneck"],
      ["blazer", "Blazer"], ["tank", "Camisole"], ["hoodie", "Hoodie"], ["stripes", "Striped tee"],
      ["offshoulder", "Off-shoulder"], ["cardigan", "Cardigan"], ["crop", "Crop top"] ] },
  { id: "bottom",  label: "👖 Bottom",  styleKey: "bottom", colorKey: "bottomColor", colors: CLOTH, styles: [
      ["pencil", "Pencil skirt"], ["midi", "Pleated midi"], ["mini", "Mini skirt"], ["maxi", "Maxi skirt"],
      ["wide", "Wide-leg pants"], ["jeans", "Slim jeans"], ["leggings", "Leggings"],
      ["culottes", "Culottes"], ["shorts", "Tailored shorts"] ] },
  { id: "dress",   label: "👗 Dress",   styleKey: "dress", colorKey: "dressColor", colors: CLOTH, styles: [
      ["none", "No dress"], ["wrap", "Wrap dress"], ["cocktail", "Cocktail dress"], ["shirt", "Shirt dress"],
      ["skater", "Skater dress"], ["sun", "Sundress"], ["maxi", "Boho maxi"], ["gown", "Evening gown"] ],
      hint: "A dress replaces the top and bottom." },
  { id: "shoes",   label: "👟 Shoes",   styleKey: "shoes", colorKey: "shoeColor", colors: SHOE, styles: [
      ["sneakers", "Sneakers"], ["boots", "Boots"], ["sandals", "Sandals"], ["heels", "High heels"],
      ["flats", "Ballet flats"], ["maryjane", "Mary Janes"] ] },
  { id: "glasses", label: "👓 Glasses", styleKey: "glasses", colorKey: "glassColor", colors: GLASS, styles: [
      ["none", "None"], ["round", "Round"], ["square", "Square"], ["oval", "Oval"], ["cateye", "Cat-eye"],
      ["aviator", "Aviator"], ["thick", "Bold frames"], ["heart", "Hearts"], ["star", "Stars"], ["sun", "Sunglasses"] ] },
  { id: "hat",     label: "👑 Hats",    styleKey: "hat", colorKey: "hatColor", colors: CLOTH, styles: [
      ["none", "None"], ["beanie", "Beanie"], ["fedora", "Fedora"], ["beret", "Beret"], ["cap", "Cap"],
      ["headband", "Headband"], ["flowers", "Flower crown"], ["crown", "Crown"], ["bow", "Big bow"],
      ["sunhat", "Sun hat"], ["ears", "Cat ears"] ] },
  { id: "extras",  label: "💎 Extras",  multi: true, styles: [
      ["necklace", "Necklace"], ["choker", "Choker"], ["earrings", "Earrings"], ["hoops", "Hoop earrings"],
      ["bracelet", "Bracelets"], ["belt", "Belt"], ["scarf", "Scarf"], ["handbag", "Handbag"],
      ["clip", "Hair clip"], ["wand", "Magic wand"], ["wings", "Fairy wings"], ["sticker", "Star sticker"] ],
      hint: "You can pick as many as you like!" },
  { id: "scene",   label: "🌈 Scene",   styleKey: "scene", styles: [
      ["sky", "Sunny sky"], ["candy", "Candy pink"], ["mint", "Mint garden"],
      ["sunset", "Sunset"], ["night", "Starry night"] ] },
  { id: "saved",   label: "⭐ My outfits",   special: "saved" },
];

const DEFAULTS = {
  skin: SKIN[1],
  hair: "long", hairColor: HAIR[1],
  top: "blouse", topColor: CLOTH[2],
  bottom: "pencil", bottomColor: CLOTH[7],
  dress: "none", dressColor: CLOTH[1],
  shoes: "sneakers", shoeColor: SHOE[0],
  glasses: "none", glassColor: GLASS[0],
  hat: "none", hatColor: CLOTH[7],
  extras: [],
  scene: "sky",
};

let state = structuredClone(DEFAULTS);
let currentTab = "hair";

/* ---------- Drawing helpers ---------- */
const OUT = 'stroke="rgba(0,0,0,.2)" stroke-width="2" stroke-linejoin="round"';

function heartPath(cx, cy, s) {
  return `M${cx} ${cy + 10*s} C${cx - 18*s} ${cy - 2*s} ${cx - 8*s} ${cy - 14*s} ${cx} ${cy - 5*s} ` +
         `C${cx + 8*s} ${cy - 14*s} ${cx + 18*s} ${cy - 2*s} ${cx} ${cy + 10*s}Z`;
}
function starPoints(cx, cy, R, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r : R;
    pts.push((cx + Math.cos(a) * rad).toFixed(1) + "," + (cy + Math.sin(a) * rad).toFixed(1));
  }
  return pts.join(" ");
}

/* ---------- Scene backgrounds ---------- */
function scene(kind, uid) {
  const grads = {
    sky:    ["#9be0ff", "#e8f9ff", "#7bd88f"],
    candy:  ["#ffc2e2", "#fff0f8", "#ffa6d0"],
    mint:   ["#b8f2d8", "#f0fff8", "#7bd88f"],
    sunset: ["#ff9a76", "#ffe0a3", "#b07acb"],
    night:  ["#1f1b4d", "#4a3f8f", "#2f2a66"],
  }[kind];
  let extra = "";
  if (kind === "night") {
    for (const [x, y] of [[30,40],[90,90],[250,50],[270,150],[60,200],[230,230],[20,320]])
      extra += `<polygon points="${starPoints(x, y, 7, 3)}" fill="#fff6a8"/>`;
    extra += `<circle cx="255" cy="70" r="22" fill="#fff6c8"/>`;
  } else if (kind === "sky") {
    extra += `<ellipse cx="70" cy="70" rx="38" ry="16" fill="#fff"/><ellipse cx="95" cy="60" rx="26" ry="14" fill="#fff"/>
              <ellipse cx="240" cy="110" rx="34" ry="14" fill="#fff"/><circle cx="260" cy="40" r="20" fill="#ffe66d"/>`;
  } else if (kind === "candy") {
    for (const [x, y] of [[40,60],[250,90],[60,250],[260,300],[150,30]])
      extra += `<path d="${heartPath(x, y, 1.3)}" fill="#ff8fc4" opacity=".6"/>`;
  } else if (kind === "mint") {
    for (const [x, y] of [[40,350],[250,360],[80,380],[220,390]])
      extra += `<circle cx="${x}" cy="${y}" r="9" fill="#ff8fc4"/><circle cx="${x}" cy="${y}" r="4" fill="#ffe66d"/>`;
  } else if (kind === "sunset") {
    extra += `<circle cx="150" cy="330" r="60" fill="#ffd36e" opacity=".8"/>`;
  }
  return `<defs><linearGradient id="bg-${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${grads[0]}"/><stop offset="1" stop-color="${grads[1]}"/></linearGradient></defs>
    <rect width="300" height="480" fill="url(#bg-${uid})"/>${extra}
    <ellipse cx="150" cy="450" rx="170" ry="40" fill="${grads[2]}"/>`;
}

/* ---------- Character parts ---------- */
function hairBack(style, c) {
  switch (style) {
    case "long":     return `<path d="M95 110 Q95 50 150 50 Q205 50 205 110 L218 235 Q150 255 82 235Z" fill="${c}" ${OUT}/>`;
    case "bob":      return `<path d="M96 115 Q96 52 150 52 Q204 52 204 115 L208 165 Q150 178 92 165Z" fill="${c}" ${OUT}/>`;
    case "ponytail": return `<path d="M192 85 Q262 90 248 200 Q238 150 196 128Z" fill="${c}" ${OUT}/>`;
    case "pigtails": return `<ellipse cx="88" cy="160" rx="16" ry="42" fill="${c}" ${OUT}/><ellipse cx="212" cy="160" rx="16" ry="42" fill="${c}" ${OUT}/>`;
    case "buns":     return `<circle cx="108" cy="52" r="24" fill="${c}" ${OUT}/><circle cx="192" cy="52" r="24" fill="${c}" ${OUT}/>`;
    case "wavy":     return `<path d="M95 110 Q95 50 150 50 Q205 50 205 110 Q221 160 208 198 Q224 230 204 252 Q178 240 150 256 Q122 240 96 252 Q76 230 92 198 Q79 160 95 110Z" fill="${c}" ${OUT}/>`;
    case "braid":    return `<path d="M96 112 Q96 52 150 52 Q204 52 204 112 L202 160 Q150 172 98 160Z" fill="${c}" ${OUT}/>`;
    case "pixie":    return "";
    case "topknot":  return `<circle cx="150" cy="38" r="21" fill="${c}" ${OUT}/><path d="M96 112 Q96 52 150 52 Q204 52 204 112Z" fill="${c}"/>`;
    case "curly": {
      let s = "";
      for (const [x, y] of [[98,70],[88,105],[88,142],[100,170],[202,70],[212,105],[212,142],[200,170],[125,52],[150,45],[175,52]])
        s += `<circle cx="${x}" cy="${y}" r="22" fill="${c}" ${OUT}/>`;
      return s;
    }
    default: return "";
  }
}
function hairFront(style, c) {
  let s = `<path d="M97 120 Q88 50 150 48 Q212 50 203 120 Q198 98 186 88 Q160 76 138 88 Q112 94 97 120Z" fill="${c}" ${OUT}/>
    <path d="M118 66 Q150 50 182 66 M130 80 Q158 66 184 82" fill="none" stroke="${lighter(c, .35)}" stroke-width="4" stroke-linecap="round" opacity=".55"/>`;
  if (style === "short") s += `<path d="M99 112 L96 135 Q104 120 108 112Z M201 112 L204 135 Q196 120 192 112Z" fill="${c}"/>`;
  if (style === "ponytail") s += `<circle cx="196" cy="100" r="7" fill="#ff5fa2"/>`;
  if (style === "pixie") s += `<path d="M97 120 L100 142 Q110 130 111 112Z M203 120 L200 142 Q190 130 189 112Z" fill="${c}" ${OUT}/>
    <path d="M112 90 L122 100 L132 88 L144 98 L156 86 L168 98 L180 88 L190 100" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (style === "braid") {
    for (let i = 0; i < 6; i++) s += `<ellipse cx="${(190 + (i % 2 ? 4 : -4))}" cy="${160 + i * 17}" rx="9" ry="10" fill="${c}" ${OUT}/>`;
    s += `<circle cx="190" cy="262" r="5" fill="#ff5fa2"/>`;
  }
  if (style === "pigtails") s += `<circle cx="92" cy="122" r="7" fill="#ff5fa2"/><circle cx="208" cy="122" r="7" fill="#ff5fa2"/>`;
  return s;
}

/* mix a hex color toward another (t = 0..1), used for natural shading */
function mix(hex, to, t) {
  const n = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [a, b] = [n(hex), n(to)];
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
const darker  = (h, t) => mix(h, "#000000", t);
const lighter = (h, t) => mix(h, "#ffffff", t);

function body(skin) {
  const sh = darker(skin, .14);
  const limb = (d, w) => `<path d="${d}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="${w + 2}" stroke-linecap="round"/>
                          <path d="${d}" fill="none" stroke="${skin}" stroke-width="${w}" stroke-linecap="round"/>`;
  return `
    <path d="M122 298 L146 298 Q147 360 142 428 L128 428 Q122 360 122 298Z" fill="${skin}" ${OUT}/>
    <path d="M154 298 L178 298 Q178 360 172 428 L158 428 Q153 360 154 298Z" fill="${skin}" ${OUT}/>
    <path d="M144 310 Q145 365 141 424 M156 310 Q155 365 159 424" fill="none" stroke="${sh}" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    ${limb("M109 190 Q98 240 97 284", 15)}
    ${limb("M191 190 Q202 240 203 284", 15)}
    <ellipse cx="97" cy="294" rx="8" ry="11" fill="${skin}" ${OUT}/><ellipse cx="203" cy="294" rx="8" ry="11" fill="${skin}" ${OUT}/>
    <path d="M140 148 L160 148 L162 184 Q150 192 138 184Z" fill="${skin}"/>
    <path d="M140 148 L160 148 L160 168 Q150 176 140 168Z" fill="${sh}" opacity=".7"/>
    <path d="${curve(edge(178, 300, -1, -1), "M")} ${curve(mirror(edge(178, 300, -1, -1)), "L")}Z" fill="${skin}"/>`;
}

function face(skin, hair) {
  const sh = darker(skin, .18);
  const brow = darker(hair, .25);
  const eye = x => `
    <ellipse cx="${x}" cy="114" rx="8.5" ry="5.5" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
    <circle cx="${x}" cy="114" r="4.6" fill="#5b3a29"/><circle cx="${x}" cy="114" r="2.1" fill="#1b1212"/>
    <circle cx="${x + 1.6}" cy="112.4" r="1.4" fill="#fff"/>`;
  return `
    <ellipse cx="103" cy="118" rx="6" ry="9" fill="${skin}" ${OUT}/><ellipse cx="197" cy="118" rx="6" ry="9" fill="${skin}" ${OUT}/>
    <path d="M104 108 Q104 56 150 56 Q196 56 196 108 Q196 150 150 164 Q104 150 104 108Z" fill="${skin}" ${OUT}/>
    <g class="eyes" style="animation-delay:-${(performance.now() / 1000 % 4).toFixed(2)}s">
      ${eye(132)}${eye(168)}
      <path d="M122 113 Q132 106 142 113 M158 113 Q168 106 178 113" fill="none" stroke="#2b2b3a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M122 113 L119 110 M178 113 L181 110" stroke="#2b2b3a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M122 101 Q132 94 143 99 M157 99 Q168 94 178 101" fill="none" stroke="${brow}" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 120 Q146 131 151 133 M146 134 Q150 137 155 134" fill="none" stroke="${sh}" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <circle cx="121" cy="133" r="9" fill="#ff8fa3" opacity=".28"/><circle cx="179" cy="133" r="9" fill="#ff8fa3" opacity=".28"/>
    <path d="M140 144 Q150 152 160 144" fill="none" stroke="#b5384f" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M145 148 Q150 152 155 148" fill="none" stroke="#e8798d" stroke-width="2" stroke-linecap="round"/>`;
}

/* ---------- Clothes (cut to follow the body's curves) ---------- */
// half-width of the torso at height y: shoulders, bust, waist (narrowest), hips
const TORSO = [[178, 36], [192, 35], [205, 34], [225, 28], [246, 23], [262, 30], [280, 36], [298, 37]];
function halfW(y) {
  for (let i = 1; i < TORSO.length; i++) {
    const [y1, w1] = TORSO[i - 1], [y2, w2] = TORSO[i];
    if (y <= y2) return w1 + (w2 - w1) * Math.max(0, y - y1) / (y2 - y1);
  }
  return TORSO[TORSO.length - 1][1];
}
const fp = q => q[0].toFixed(1) + " " + q[1].toFixed(1);
// points along the left (sign -1) or right (+1) side of the torso, with optional extra room g
function edge(y0, y1, sign, g = 0) {
  const out = [], step = y1 >= y0 ? 8 : -8;
  for (let y = y0; step > 0 ? y < y1 : y > y1; y += step) out.push([150 + sign * (halfW(y) + g), y]);
  out.push([150 + sign * (halfW(y1) + g), y1]);
  return out;
}
// smooth path through points (quadratic curves through the midpoints)
function curve(p, first = "M") {
  if (p.length < 3) return p.map((q, i) => (i ? "L" : first) + fp(q)).join(" ");
  let d = first + fp(p[0]);
  for (let i = 1; i < p.length - 1; i++) d += ` Q${fp(p[i])} ${fp([(p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2])}`;
  return d + ` L${fp(p[p.length - 1])}`;
}
const mirror = pts => pts.map(([x, y]) => [300 - x, y]).reverse();
// closed shape from a left outline (top to bottom); the right side is its mirror image
const symmetric = left => curve(left, "M") + " " + curve(mirror(left), "L") + "Z";
const band = (y0, y1, g) => symmetric([...edge(y0, y1, -1, g)]);
const sleeves = (c, d1, d2, w = 17) =>
  `<path d="${d1}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="${w + 2}" stroke-linecap="round"/>
   <path d="${d2}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="${w + 2}" stroke-linecap="round"/>
   <path d="${d1}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>
   <path d="${d2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const LONG = ["M109 190 Q98 238 97 282", "M191 190 Q202 238 203 282"];
const THREEQ = ["M109 190 Q99 228 98 264", "M191 190 Q201 228 202 264"];

function bottomWear(style, c) {
  const dk = darker(c, .22);
  const waist = `<path d="${band(243, 254, 1.5)}" fill="${dk}" ${OUT}/>`;
  switch (style) {
    case "pencil": {

    case "flowers": {
      const f = (x, y, r, col) => [0, 1, 2, 3, 4].map(i => { const a = i * 72 * Math.PI / 180;
        return `<circle cx="${(x + Math.cos(a) * r).toFixed(1)}" cy="${(y + Math.sin(a) * r).toFixed(1)}" r="${(r * .8).toFixed(1)}" fill="${col}"/>`; }).join("") +
        `<circle cx="${x}" cy="${y}" r="${(r * .7).toFixed(1)}" fill="#ffd23f"/>`;
      let out = `<path d="M102 98 Q96 54 150 50 Q204 54 198 98" fill="none" stroke="#5aa86a" stroke-width="4"/>`;
      [[106, 88], [116, 64], [136, 53], [160, 52], [182, 62], [194, 84]].forEach(([x, y], i) => out += f(x, y, 6.5, i % 2 ? lighter(c, .4) : c));
      return out;
    }
    case "ears":
      return `<path d="M104 70 L108 26 L138 56Z M196 70 L192 26 L162 56Z" fill="${c}" ${OUT}/>
              <path d="M112 58 L112 40 L128 54Z M188 58 L188 40 L172 54Z" fill="#ffc2e2"/>`;
  }
  return "";
}

function extraBack(list) {
  if (!list.includes("wings")) return "";
  return `<path d="M130 195 Q40 120 50 225 Q60 275 130 255Z" fill="#c9f1ff" stroke="#8fd3ee" stroke-width="3" opacity=".9"/>
          <path d="M170 195 Q260 120 250 225 Q240 275 170 255Z" fill="#c9f1ff" stroke="#8fd3ee" stroke-width="3" opacity=".9"/>`;
}
function extraFront(list) {
  let s = "";
  if (list.includes("necklace")) s += `<path d="M125 182 Q150 215 175 182" fill="none" stroke="#ffd23f" stroke-width="3"/><path d="${heartPath(150, 208, .7)}" fill="#ff5fa2"/>`;
  if (list.includes("scarf"))    s += `<rect x="124" y="170" width="52" height="16" rx="8" fill="#e63946" ${OUT}/><path d="M160 180 L176 230 L158 226Z" fill="#e63946" ${OUT}/>`;
  if (list.includes("earrings")) s += `<circle cx="100" cy="128" r="5" fill="#ffd23f"/><circle cx="200" cy="128" r="5" fill="#ffd23f"/>`;
  if (list.includes("sticker"))  s += `<polygon points="${starPoints(186, 138, 8, 3.5)}" fill="#ffd23f" stroke="#e0a800" stroke-width="1"/>`;
  if (list.includes("hoops"))    s += `<circle cx="100" cy="140" r="9" fill="none" stroke="#e8c768" stroke-width="3"/><circle cx="200" cy="140" r="9" fill="none" stroke="#e8c768" stroke-width="3"/>`;
  if (list.includes("choker"))   s += `<path d="M138 164 Q150 174 162 164" fill="none" stroke="#1f1f2b" stroke-width="3.5" stroke-linecap="round"/><circle cx="150" cy="172" r="2.8" fill="#e8c768"/>`;
  if (list.includes("bracelet")) s += `<ellipse cx="97" cy="283" rx="8" ry="3" fill="none" stroke="#e8c768" stroke-width="3"/><ellipse cx="203" cy="283" rx="8" ry="3" fill="none" stroke="#e8c768" stroke-width="3"/>`;
  if (list.includes("belt"))     s += `<path d="${band(241, 252, 3)}" fill="#6b3f26" ${OUT}/><rect x="142" y="240" width="16" height="13" rx="2" fill="#e8c768" ${OUT}/>`;
  if (list.includes("clip"))     s += `<polygon points="${starPoints(124, 76, 9, 4)}" fill="#ff5fa2" stroke="#d63384" stroke-width="1.5"/>`;
  if (list.includes("handbag"))  s += `<path d="M199 300 Q201 280 212 280 Q224 280 226 300" fill="none" stroke="#7a4426" stroke-width="3"/>
                                       <rect x="192" y="298" width="42" height="32" rx="7" fill="#c9733d" ${OUT}/><rect x="208" y="306" width="10" height="7" rx="2" fill="#e8c768"/>`;
  if (list.includes("wand"))     s += `<line x1="206" y1="290" x2="236" y2="222" stroke="#b07acb" stroke-width="5" stroke-linecap="round"/>
                                       <polygon points="${starPoints(240, 210, 18, 8)}" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>
                                       <circle cx="206" cy="290" r="10" fill="rgba(0,0,0,0)"/>`;
  return s;
}

/* ---------- Render ---------- */
function buildSvg(s, { uid = "main", animated = false } = {}) {
  const hasDress = s.dress !== "none";
  const bobDelay = (performance.now() / 1000 % 3).toFixed(2);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" role="img" aria-label="Dress-up character">
    ${scene(s.scene, uid)}
    <g class="${animated ? "bob" : ""}" style="animation-delay:-${bobDelay}s"><g class="char">
    ${extraBack(s.extras)}
    ${hairBack(s.hair, s.hairColor)}
    ${body(s.skin)}
    ${hasDress ? dressWear(s.dress, s.dressColor) : bottomWear(s.bottom, s.bottomColor) + topWear(s.top, s.topColor)}
    ${shoeWear(s.shoes, s.shoeColor)}
    ${face(s.skin, s.hairColor)}
    ${hairFront(s.hair, s.hairColor)}
    ${glassesWear(s.glasses, s.glassColor)}
    ${hatWear(s.hat, s.hatColor)}
    ${extraFront(s.extras)}
    </g></g>
  </svg>`;
}

function render() {
  document.getElementById("stage").innerHTML = buildSvg(state, { animated: true });
  renderOptions();
}

/* ---------- Sound (generated in the browser, no files needed) ---------- */
let audio = null, muted = false;
function tone(freq, dur = 0.12, type = "sine", when = 0, vol = 0.15) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime + when;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* sound is optional */ }
}
const sfx = {
  pick()   { tone(660, .08, "triangle"); tone(880, .1, "triangle", .06); },
  color()  { tone(440 + Math.random() * 440, .1, "sine"); },
  random() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .12, "triangle", i * .07)); },
  save()   { tone(784, .1, "sine"); tone(1047, .2, "sine", .1); },
  twirl()  { [392, 523, 659, 784, 988].forEach((f, i) => tone(f, .1, "sine", i * .06)); },
};

/* ---------- Sparkles & twirl ---------- */
function sparkle(n = 6) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const wrap = document.getElementById("wrap");
  for (let i = 0; i < n; i++) {
    const el = document.createElement("span");
    el.className = "sparkle";
    el.textContent = pick(["✨", "⭐", "💖", "🌟"]);
    el.style.left = (10 + Math.random() * 75) + "%";
    el.style.top = (15 + Math.random() * 65) + "%";
    el.style.animationDelay = (Math.random() * .25) + "s";
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }
}
function twirl() {
  const c = document.querySelector("#stage .char");
  if (!c) return;
  c.classList.remove("twirl"); void c.getBoundingClientRect(); c.classList.add("twirl");
  sfx.twirl(); sparkle(8);
}
function acted(n) { sfx.pick(); sparkle(n); }

/* ---------- Saved outfits (kept in this browser only) ---------- */
const STORE = "dressup.saved";
const OLD = { top: { heart: "tee", hoodie: "turtle" }, bottom: { skirt: "pencil", longskirt: "midi", pants: "jeans" }, dress: { party: "cocktail" } };
function outfitOf(o) {
  const out = { ...structuredClone(DEFAULTS), ...structuredClone(o) };
  for (const k in OLD) if (OLD[k][out[k]]) out[k] = OLD[k][out[k]];
  return out;
}
function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { return []; }
}
function storeSaved(list) {
  try { localStorage.setItem(STORE, JSON.stringify(list)); return true; } catch (e) { return false; }
}

function renderSaved(box) {
  const list = loadSaved();
  const h = document.createElement("h2");
  h.textContent = "⭐ My outfits";
  box.appendChild(h);

  const add = document.createElement("button");
  add.className = "primary big";
  add.textContent = "💾 Save this outfit";
  add.onclick = () => {
    if (list.length >= 12) { alert("You can keep 12 outfits. Delete one first!"); return; }
    if (!storeSaved([...list, structuredClone(state)])) { alert("Sorry, this browser won't let me save outfits."); return; }
    sfx.save(); sparkle(8); renderOptions();
  };
  box.appendChild(add);

  if (!list.length) {
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = "No saved outfits yet. Make a look you love and press Save!";
    box.appendChild(p);
    return;
  }
  const grid = document.createElement("div");
  grid.className = "saved-grid";
  list.forEach((outfit, i) => {
    const item = document.createElement("div");
    item.className = "saved-item";
    item.innerHTML = buildSvg(outfitOf(outfit), { uid: "saved" + i });
    const row = document.createElement("div");
    row.className = "row";
    const wear = document.createElement("button");
    wear.textContent = "Wear";
    wear.onclick = () => { state = outfitOf(outfit); render(); acted(6); };
    const del = document.createElement("button");
    del.textContent = "🗑️";
    del.setAttribute("aria-label", "Delete outfit");
    del.onclick = () => { storeSaved(list.filter((_, j) => j !== i)); sfx.pick(); renderOptions(); };
    row.append(wear, del);
    item.appendChild(row);
    grid.appendChild(item);
  });
  box.appendChild(grid);
  const p = document.createElement("p");
  p.className = "hint";
  p.textContent = "Outfits are saved in this browser on this computer.";
  box.appendChild(p);
}

/* ---------- Menu ---------- */
function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const cat of CATS) {
    const b = document.createElement("button");
    b.textContent = cat.label;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", cat.id === currentTab);
    b.onclick = () => { currentTab = cat.id; renderTabs(); renderOptions(); };
    tabs.appendChild(b);
  }
}

function renderOptions() {
  const cat = CATS.find(c => c.id === currentTab);
  const box = document.getElementById("options");
  box.innerHTML = "";

  if (cat.special === "saved") return renderSaved(box);

  if (cat.styles) {
    const h = document.createElement("h2");
    h.textContent = cat.multi ? "Pick your extras" : "Pick a style";
    box.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "styles";
    for (const [value, label] of cat.styles) {
      const b = document.createElement("button");
      b.textContent = label;
      const on = cat.multi ? state.extras.includes(value) : state[cat.styleKey] === value;
      b.setAttribute("aria-pressed", on);
      b.onclick = () => {
        if (cat.multi) {
          state.extras = on ? state.extras.filter(v => v !== value) : [...state.extras, value];
        } else {
          state[cat.styleKey] = value;
        }
        render();
        acted(3);
      };
      grid.appendChild(b);
    }
    box.appendChild(grid);
  }

  if (cat.colors) {
    const h = document.createElement("h2");
    h.textContent = "Pick a color";
    box.appendChild(h);
    const row = document.createElement("div");
    row.className = "swatches";
    for (const color of cat.colors) {
      const b = document.createElement("button");
      b.className = "swatch";
      b.style.background = color;
      b.setAttribute("aria-label", "Color " + color);
      b.setAttribute("aria-pressed", state[cat.colorKey] === color);
      b.onclick = () => { state[cat.colorKey] = color; render(); sfx.color(); sparkle(2); };
      row.appendChild(b);
    }
    box.appendChild(row);
  }

  if (cat.hint) {
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = cat.hint;
    box.appendChild(p);
  }
}

/* ---------- Buttons ---------- */
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

document.getElementById("random").onclick = () => {
  const next = { extras: [] };
  for (const cat of CATS) {
    if (cat.styleKey) next[cat.styleKey] = pick(cat.styles)[0];
    if (cat.colorKey) next[cat.colorKey] = pick(cat.colors);
  }
  for (const e of CATS.find(c => c.multi).styles) if (Math.random() < 0.3) next.extras.push(e[0]);
  if (Math.random() < 0.6) next.glasses = "none";
  if (Math.random() < 0.5) next.hat = "none";
  if (Math.random() < 0.7) next.dress = "none";
  state = next;
  render();
  sfx.random(); sparkle(10);
};

document.getElementById("reset").onclick = () => {
  state = structuredClone(DEFAULTS);
  render();
  sfx.pick();
};

document.getElementById("twirl").onclick = twirl;

document.getElementById("mute").onclick = e => {
  muted = !muted;
  e.currentTarget.textContent = muted ? "🔇 Sound off" : "🔊 Sound on";
  e.currentTarget.setAttribute("aria-pressed", muted);
  if (!muted) sfx.pick();
};

document.getElementById("save").onclick = () => {
  const svg = document.querySelector("#stage svg");
  const data = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = 900; canvas.height = 1440;
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    const a = document.createElement("a");
    a.download = "my-dress-up-star.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  img.src = data;
};

renderTabs();
render();
</script>
</body>
</html>
